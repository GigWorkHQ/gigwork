name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check and test
    if: github.repository == 'gigworkhq/gigwork'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gigwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gigwork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_TESTS: "1"
      RATE_LIMIT_AUTH_PER_MINUTE: "10000"
      RATE_LIMIT_WRITE_PER_MINUTE: "100000"
      DATABASE_URL: postgresql://test:test@localhost:5432/gigwork_test
      RH_CHAIN_ID: "46630"
      RH_RPC_URL: http://127.0.0.1:8545
      USDG_TOKEN_ADDRESS: "0x0000000000000000000000000000000000000001"
      USDG_DECIMALS: "6"
      RH_CONFIRMATIONS: "2"
      AUTH_DOMAIN: localhost
      AUTH_URI: http://localhost:3001
      AUTH_TOKEN_PEPPER: gigwork-ci-auth-pepper-0123456789abcdef
      DATA_ENCRYPTION_KEY: gigwork-ci-encryption-key-0123456789
      GAS_WALLET_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      CRON_SECRET: gigwork-ci-cron-secret-0123456789abcdef
      TEAM_WALLET_ADDRESSES: "0x2222222222222222222222222222222222222222"
      TRUST_PROXY: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Type-check backend
        working-directory: backend
        run: bun run check

      - name: Run backend unit, route and escrow-invariant suites (real Postgres 16)
        working-directory: backend
        run: bun run test

      - name: Run frontend domain suite
        run: bun run test

  supply-chain:
    name: Advisories and secret scan
    if: github.repository == 'gigworkhq/gigwork'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fail on known advisories in backend dependencies (OSV)
        run: python3 scripts/osv-check.py backend/bun.lock

      - name: Report advisories in frontend dependencies (OSV)
        run: python3 scripts/osv-check.py --report-only bun.lock

      - name: Scan history for committed secrets (gitleaks 8.30.1)
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  build:
    name: Build backend image
    needs: [test, supply-chain]
    if: github.repository == 'gigworkhq/gigwork' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build backend image archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/gigworkhq/gigwork-backend:${{ github.sha }}
          outputs: type=docker,dest=./gigwork-backend.tar

      - name: Store backend image for publishing
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: gigwork-backend-image
          path: gigwork-backend.tar
          retention-days: 1

  publish:
    name: Publish backend image
    needs: build
    if: github.repository == 'gigworkhq/gigwork' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/gigworkhq/gigwork-backend
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: gigwork-backend-image

      - name: Publish immutable and latest tags
        env:
          IMAGE_NAME: ghcr.io/gigworkhq/gigwork-backend
        run: |
          docker load --input gigwork-backend.tar
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

  deploy:
    name: Deploy and verify backend
    needs: publish
    if: github.repository == 'gigworkhq/gigwork' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deployment and verify readiness
        env:
          DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Set BACKEND_DEPLOY_HOOK_URL in the production environment secrets."
            exit 1
          fi
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Set BACKEND_URL in the production environment variables."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          BACKEND_URL="${BACKEND_URL%/}"
          for attempt in $(seq 1 60); do
            commit=$(curl --silent --max-time 5 "$BACKEND_URL/health" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ] && \
              curl --fail --silent --max-time 5 "$BACKEND_URL/health/ready" > /dev/null; then
              echo "Commit $GITHUB_SHA is serving and ready."
              break
            fi
            if [ "$attempt" = 60 ]; then
              echo "::error::Commit $GITHUB_SHA was not serving and ready at $BACKEND_URL within 10 minutes."
              exit 1
            fi
            sleep 10
          done

      - name: Verify live chain configuration
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          EXPECTED_CHAIN_ID: "4663"
          EXPECTED_USDG: "0x5fc5360d0400a0fd4f2af552add042d716f1d168"
          EXPECTED_DECIMALS: "6"
        run: |
          BACKEND_URL="${BACKEND_URL%/}"
          config=$(curl --fail --silent --show-error --max-time 10 "$BACKEND_URL/v1/config")
          chain=$(echo "$config" | jq -r '.data.chainId')
          usdg=$(echo "$config" | jq -r '.data.usdg.address')
          decimals=$(echo "$config" | jq -r '.data.usdg.decimals')
          if [ "$chain" != "$EXPECTED_CHAIN_ID" ] || [ "$usdg" != "$EXPECTED_USDG" ] || [ "$decimals" != "$EXPECTED_DECIMALS" ]; then
            echo "::error::Live config is chain $chain, USDG $usdg ($decimals decimals); expected chain $EXPECTED_CHAIN_ID, USDG $EXPECTED_USDG ($EXPECTED_DECIMALS)."
            exit 1
          fi
          ops=$(curl --fail --silent --show-error --max-time 10 "$BACKEND_URL/health/ops")
          echo "Gas wallet: $(echo "$ops" | jq -r '.data.gasWallet') holds $(echo "$ops" | jq -r '.data.gasBalanceEth') ETH"
          if [ "$(echo "$ops" | jq -r '.data.gasLow')" = "true" ]; then
            echo "::warning::The gas wallet is below its alert threshold. Top it up; see docs/RUNBOOK.md."
          fi

  release:
    name: Create backend release
    needs: deploy
    if: github.repository == 'gigworkhq/gigwork' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - id: tag
        name: Create release tag
        run: echo "name=backend-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: git tag "$RELEASE_TAG" && git push origin "$RELEASE_TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
